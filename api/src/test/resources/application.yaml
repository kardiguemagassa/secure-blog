spring:
  datasource:
    url: jdbc:h2:mem:secure_blog_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

app:
  jwt:
    # Clé de test uniquement : ne jamais utiliser en production
    secret: "dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtdGVzdHMtMzItYnl0ZXM="
    issuer: secure-blog
    expiration-minutes: 60